apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
android {
    lint {
        baseline = file("lint-baseline.xml")
    }
//    compileSdkPreview compileSDK
    compileSdk compileSDK
    defaultConfig {
        applicationId "dev.skomlach.biometric.app"
        minSdkVersion minSDK
        //targetSdkPreview targetSDK
        targetSdkVersion targetSDK
        versionCode libsVersionCode
        versionName libsMajorVersion
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            jniDebuggable false
            debuggable false
            //renderscriptDebuggable false
            proguardFile "proguard-rules.pro"
            proguardFile getDefaultProguardFile("proguard-android-optimize.txt")
        }

        debug {
            minifyEnabled true
            shrinkResources true
            jniDebuggable false
            debuggable true
            //renderscriptDebuggable false
            proguardFile "proguard-rules.pro"
            proguardFile getDefaultProguardFile("proguard-android-optimize.txt")
        }

        // Consumer integration gate: wrappers present, neither vendor runtime packaged.
        sdkAbsent {
            initWith debug
            matchingFallbacks = ['debug']
            minifyEnabled false
            shrinkResources false
        }
    }
    sourceSets.debug.jniLibs.srcDir rootProject.file('biometric-zkfinger/vendor-sdk/jniLibs')
    buildFeatures {
        viewBinding true
    }
    namespace 'dev.skomlach.biometric.app'
    compileOptions {
        sourceCompatibility javaVersion
        targetCompatibility javaVersion
    }
    kotlinOptions {
        jvmTarget = javaVersion.toString()
    }

}
kotlin {
    jvmToolchain(javaVersion.ordinal() + 1)
}
dependencies {
    implementation project(":" + libArtifactId_common)
    implementation project(":" + libArtifactId_biometric)
    implementation project(":" + libArtifactId_biometric_ktx)
    implementation project(":" + libArtifactId_biometric_custom_face_tf)
    implementation project(":" + libArtifactId_biometric_zkfinger)
    implementation project(":" + libArtifactId_biometric_sherpa_onnx)
    implementation project(":" + libArtifactId_biometric_custom_voice)

    // Local-only runtime downloaded from the official sherpa-onnx release. It is intentionally
    // absent from source control and release builds; production consumers add their own copy.
    def localSherpaOnnxAar = rootProject.file(
        "biometric-sherpa-onnx/vendor-sdk/libs/sherpa-onnx-1.13.8.aar"
    )
    if (localSherpaOnnxAar.isFile()) {
        debugImplementation files(localSherpaOnnxAar)
    }
    // Only the sample Debug app opts into vendor runtimes. Libraries never redistribute them.
    debugRuntimeOnly fileTree(dir: rootProject.file('biometric-zkfinger/vendor-sdk/libs'), include: ['*.jar'])

//"dev.skomlach:biometric:${libsMajorVersion + "." + libsMinorVersion}"
    implementation libs.conscrypt.android
    implementation libs.androidx.multidex
    implementation libs.kotlin.stdlib
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.dexlib2

//    //DevTools
//    //ANR's
//    implementation libs.anrwatchdog
//    //memory leaks
    implementation libs.leakcanary.android
    implementation(libs.chucker.library)
    //releaseImplementation(libs.chucker.library.no.op)

    implementation libs.okhttp
    implementation libs.okhttp.urlconnection
    implementation libs.gson
}
