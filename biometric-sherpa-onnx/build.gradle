apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def localSherpaOnnxAar = rootProject.file(
    "biometric-sherpa-onnx/vendor-sdk/libs/sherpa-onnx-1.13.8.aar"
)
if (!localSherpaOnnxAar.isFile()) {
    throw new GradleException(
        "biometric-sherpa-onnx requires the official sherpa-onnx-1.13.8.aar at " +
            localSherpaOnnxAar + " to compile its direct integration"
    )
}

android {
    compileSdk compileSDK
    defaultConfig {
        minSdkVersion minSDK
        targetSdkVersion targetSDK
        consumerProguardFiles "proguard-project-biometric-sherpa-onnx.pro"
    }
    namespace 'dev.skomlach.biometric.sherpaonnx'
    compileOptions {
        sourceCompatibility javaVersion
        targetCompatibility javaVersion
    }
    kotlinOptions {
        jvmTarget = javaVersion.toString()
    }
}

dependencies {
    implementation project(":" + libArtifactId_common)
    implementation project(":" + libArtifactId_biometric)
    // Compile against the official API without bundling its Java classes or native libraries.
    compileOnly files(localSherpaOnnxAar)
    testImplementation libs.junit
}


ext {
    PUBLISH_GROUP_ID = libsGroupId
    PUBLISH_ARTIFACT_ID = libArtifactId_biometric_sherpa_onnx
    PUBLISH_VERSION = libVersion
}

apply from: "${rootProject.projectDir}/scripts/publish-mavencentral.gradle"
