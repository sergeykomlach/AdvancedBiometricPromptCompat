apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def localZkFingerSdkJars = [
    rootProject.file("biometric-zkfinger/vendor-sdk/libs/zkandroidcore.jar"),
    rootProject.file("biometric-zkfinger/vendor-sdk/libs/zkandroidfingerservice.jar"),
    rootProject.file("biometric-zkfinger/vendor-sdk/libs/zkandroidfpreader.jar")
]
def missingZkFingerSdkJars = localZkFingerSdkJars.findAll { !it.isFile() }
if (!missingZkFingerSdkJars.isEmpty()) {
    throw new GradleException(
        "biometric-zkfinger requires official ZKTeco JARs for its direct integration: " +
            missingZkFingerSdkJars.join(', ')
    )
}

android {
    lint {
        baseline = file("lint-baseline.xml")
    }
    compileSdk compileSDK
    defaultConfig {
        minSdkVersion minSDK
        targetSdkVersion targetSDK
        multiDexEnabled true
        consumerProguardFiles "proguard-project-biometric-zkfinger.pro"
    }
    namespace 'dev.skomlach.biometric.zkfinger'
    compileOptions {
        sourceCompatibility javaVersion
        targetCompatibility javaVersion
    }
    kotlinOptions {
        jvmTarget = javaVersion.toString()
    }
}

dependencies {
    implementation project(":" + libArtifactId_common)
    implementation project(":" + libArtifactId_biometric)
    implementation libs.androidx.core.ktx
    // Compile against the official SDK without bundling its classes or native libraries.
    compileOnly files(localZkFingerSdkJars)
    testImplementation libs.junit
    // Runtime belongs to the consuming app, in every variant (including Debug).
}

// Publishing
ext {
    PUBLISH_GROUP_ID = libsGroupId
    PUBLISH_ARTIFACT_ID = libArtifactId_biometric_zkfinger
    PUBLISH_VERSION = libVersion
}

apply from: "${rootProject.projectDir}/scripts/publish-mavencentral.gradle"
