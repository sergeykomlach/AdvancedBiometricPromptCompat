import org.gradle.api.publish.maven.tasks.PublishToMavenRepository
import org.gradle.api.artifacts.type.ArtifactTypeDefinition
import org.gradle.plugins.signing.Sign
import java.util.zip.ZipFile

// Build/inspect only. This gate must never publish or use release signing credentials.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it instanceof PublishToMavenRepository || it instanceof Sign || it.name == 'postRelease' }) {
        throw new GradleException('Maven signing and remote publication forbidden by consumer verification')
    }
}
gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register('verifyOptionalConsumerContract') {
        dependsOn ':app:assembleSdkAbsent', ':biometric-ktx:generatePomFileForReleasePublication'
        doLast {
            def app = root.project(':app')
            // AGP publishes multiple artifact types per variant; select the class artifact
            // and inspect its original component identity, not transformed classes.jar names.
            def artifacts = app.configurations.sdkAbsentRuntimeClasspath.incoming.artifactView {
                attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'android-classes-jar')
            }.artifacts.artifacts
            def forbidden = artifacts.findAll {
                def identity = it.id.componentIdentifier.displayName
                identity =~ /(?i)(zkandroid[^\/\\]*\.jar|sherpa-onnx[^\/\\]*\.aar)/
            }
            assert forbidden.empty : "Vendor runtime leaked into consumer: ${forbidden}"
            // JNI source directories bypass Gradle's dependency graph. Inspect the APK too.
            def vendorNativeNames = root.fileTree('biometric-zkfinger/vendor-sdk/jniLibs') {
                include '**/*.so'
            }.files.collect { it.name } as Set
            root.fileTree('biometric-sherpa-onnx/vendor-sdk/libs') {
                include 'sherpa-onnx*.aar'
            }.files.each { aar ->
                new ZipFile(aar).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (entry.name.startsWith('jni/') && entry.name.endsWith('.so')) {
                            vendorNativeNames.add(entry.name.tokenize('/').last())
                        }
                    }
                }
            }
            def apk = app.layout.buildDirectory.file('outputs/apk/sdkAbsent/app-sdkAbsent.apk').get().asFile
            new ZipFile(apk).withCloseable { zip ->
                def leakedNative = zip.entries().findAll {
                    it.name.startsWith('lib/') && vendorNativeNames.contains(it.name.tokenize('/').last())
                }
                assert leakedNative.empty : "Vendor native libraries leaked into APK: ${leakedNative}"
            }
            def ktx = root.project(':biometric-ktx')
            def pom = new XmlSlurper().parse(ktx.layout.buildDirectory.file('publications/release/pom-default.xml').get().asFile)
            def core = pom.dependencies.dependency.findAll { it.artifactId.text() == 'biometric' }
            assert core.size() == 1 && core[0].scope.text() == 'compile' : 'KTX must export core exactly once'
            println 'Consumer contract passed: SDK-absent APK built, vendor runtimes absent, KTX core dependency present.'
        }
    }
    root.tasks.register('verifyKtxDocumentationContract') {
        dependsOn ':biometric-ktx:androidJavadocJar'
        doLast {
            def ktx = root.project(':biometric-ktx')
            new ZipFile(ktx.tasks.androidJavadocJar.archiveFile.get().asFile).withCloseable { zip ->
                assert zip.getEntry('index.html') != null : 'Missing generated Dokka API index'
                assert zip.entries().find { it.name.contains('start-biometric-authentication') } != null : 'Missing KTX API pages'
            }
            println 'Documentation contract passed: generated KTX API index and extension pages present.'
        }
    }
}
